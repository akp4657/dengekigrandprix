<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dengeki Grand Prix — monthly PC tournament series."
    />
    <meta name="theme-color" content="#ff3b80" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Dengeki Grand Prix!!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg__blob bg__blob--a"></div>
      <div class="bg__blob bg__blob--b"></div>
      <div class="bg__blob bg__blob--c"></div>
    </div>

    <main class="page">
      <div class="commballs" aria-hidden="true">
        <img
          class="commball commball--1"
          src="/commball-adwins.png"
          width="400"
          height="400"
          alt=""
          decoding="async"
        />
        <img
          class="commball commball--2"
          src="/commball-noddy.png"
          width="400"
          height="400"
          alt=""
          decoding="async"
        />
        <img
          class="commball commball--3"
          src="/commball-gary.png"
          width="400"
          height="400"
          alt=""
          decoding="async"
        />
      </div>

      <div class="page__intro">
        <h1 class="page__title">Dengeki Grand Prix</h1>
        <p class="page__tagline">
          A monthly month-long online event!<br />
          Guaranteed FT3 sets each week | FT7 Finals<br /><br />
          New/Intermediate and Open entry events<br />
          Prize pool each month! Community driven!
        </p>
      </div>

      <div class="promo__media">
        <video
          class="promo__video"
          poster="/promo-poster.jpg"
          width="1280"
          height="720"
          autoplay
          muted
          loop
          playsinline
          webkit-playsinline
          preload="auto"
          aria-label="Dengeki Grand Prix promo video"
        >
          <source src="/promo.mp4" type="video/mp4" />
        </video>
      </div>

      <div class="page__actions">
        <a
          class="btn btn--join"
          href="https://discord.gg/SBFyFSdWeF"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            class="btn__icon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.1 16.1 0 0 0-4.8 0c-.14-.34-.36-.76-.54-1.09c-.01-.02-.04-.03-.07-.03c-1.5.26-2.93.71-4.27 1.33c-.01 0-.02.01-.03.02c-2.72 4.07-3.47 8.03-3.1 11.95c0 .02.01.04.03.05c1.8 1.32 3.53 2.12 5.24 2.65c.03.01.06 0 .07-.02c.4-.55.76-1.13 1.07-1.74c.02-.04 0-.08-.04-.09c-.57-.22-1.11-.48-1.64-.78c-.04-.02-.04-.08-.01-.11c.11-.08.22-.17.33-.25c.02-.02.05-.02.07-.01c3.44 1.57 7.15 1.57 10.55 0c.02-.01.05-.01.07.01c.11.09.22.17.33.26c.04.03.04.09-.01.11c-.52.31-1.07.56-1.64.78c-.04.01-.05.06-.04.09c.32.61.68 1.19 1.07 1.74c.01.02.04.03.07.02c1.72-.53 3.45-1.33 5.25-2.65c.02-.01.03-.03.03-.05c.44-4.53-.73-8.46-3.1-11.95c-.01-.01-.02-.02-.04-.02zM8.52 14.91c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.84 2.12-1.89 2.12zm6.97 0c-1.03 0-1.89-.95-1.89-2.12s.84-2.12 1.89-2.12c1.06 0 1.9.96 1.89 2.12c0 1.17-.83 2.12-1.89 2.12z"
            />
          </svg>
          Join the Discord!
        </a>
        <a
          class="btn btn--join"
          href="https://www.youtube.com/@thespine_"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            class="btn__icon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8zM9.8 15.5v-7l6.3 3.5-6.3 3.5z"
            />
          </svg>
          Watch the GP!
        </a>
        <a
          class="btn btn--join"
          href="https://x.com/DFCGrandPrix"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            class="btn__icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"
            />
          </svg>
          Follow on Twitter!
        </a>
      </div>

      <picture class="site-logo">
        <source srcset="/logo.webp" type="image/webp" />
        <img
          class="site-logo__img"
          src="/logo.png"
          width="720"
          height="720"
          alt="Dengeki Grand Prix"
          decoding="async"
        />
      </picture>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
